*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:1010px;margin:0 auto;padding:40px 22px 80px}
h1{font-size:26px;margin:0 0 8px;letter-spacing:-.01em;line-height:1.28}
h2{font-size:17px;margin:0 0 3px}
.sub{color:var(--ink2);margin:0 0 20px;max-width:70ch}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px}
.cs{font-size:13px;color:var(--ink2);margin:0 0 14px;max-width:74ch}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{font:inherit;font-size:13px;padding:5px 14px;border-radius:20px;border:1px solid var(--line);

.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.pan{border:1px solid var(--grid);border-radius:9px;padding:10px 10px 6px}
.pt{font-size:13.5px;font-weight:600;line-height:1.25;margin:0}
.pm{font-size:11.5px;color:var(--ink3);margin:1px 0 6px}
.pv{float:left;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pv.u{color:var(--up)}.pv.d{color:var(--dn)}
svg{display:block;overflow:visible}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:0 0 12px}
.leg i{display:inline-block;width:20px;height:2.5px;border-radius:2px;vertical-align:middle;margin-left:6px}
.note{font-size:13.5px;color:var(--ink2);max-width:70ch}.note b{color:var(--ink)}
table{border-collapse:collapse;font-size:12.5px;width:100%;min-width:600px}
th,td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
th{color:var(--ink2);font-weight:600}td.t{white-space:normal;font-variant-numeric:normal}
.scroll{overflow-x:auto}
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surf);border:1px solid var(--line);

#tip .m{color:var(--ink2);font-size:11.5px;margin-bottom:5px}
